# Baseline FP16 inference benchmark configuration
experiment_name: baseline_fp16

data:
  root: ./data
  image_size: 256
  batch_size: 8
  num_workers: 0

model:
  checkpoint: results/checkpoints/best_model.pt
  base_filters: 64
  bilinear: true

benchmark:
  precision: fp16          # fp16 on MPS/CUDA, fp32 on CPU
  warmup_runs: 20
  latency_runs: 100
  batch_size_throughput: 16
  input_size: [256, 256]

paths:
  output_dir: results
