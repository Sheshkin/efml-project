# ONNX Runtime backend benchmark configuration
experiment_name: onnx_backend

data:
  root: ./data
  image_size: 256
  batch_size: 8
  num_workers: 0

model:
  checkpoint: results/checkpoints/best_model.pt
  base_filters: 64
  bilinear: true

benchmark:
  precision: fp16
  warmup_runs: 20
  latency_runs: 100
  batch_size_throughput: 16
  input_size: [256, 256]
  seed: 42

paths:
  output_dir: results
