# Quantization-Aware Training (QAT) configuration
experiment_name: qat_int8

data:
  root: ./data
  image_size: 256
  batch_size: 8
  val_fraction: 0.15
  num_workers: 0
  seed: 42

model:
  checkpoint: results/checkpoints/best_model.pt
  base_filters: 64
  bilinear: true

benchmark:
  warmup_runs: 20
  latency_runs: 100
  batch_size_throughput: 16
  input_size: [256, 256]

qat:
  epochs: 2
  lr: 1.0e-5
  weight_decay: 1.0e-5
  max_qat_batches: 100
  seed: 42

paths:
  output_dir: results
