# Fine-tuning configuration
experiment_name: finetune_baseline

data:
  root: ./data
  image_size: 256
  batch_size: 8
  val_fraction: 0.15
  num_workers: 0
  seed: 42

model:
  base_filters: 64
  bilinear: true

training:
  epochs: 30
  lr: 1.0e-4
  weight_decay: 1.0e-5
  seed: 42

paths:
  checkpoint_dir: results/checkpoints
  log_dir: results/logs
